<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="CampusAnon — Anonymous Dating for IIIT Pune"/>
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-180.png"/>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <title>CampusAnon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-elevated: #2c2c2e;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text: #f5f5f7;
      --text-secondary: rgba(245,245,247,0.6);
      --text-tertiary: rgba(245,245,247,0.3);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --success: #30d158;
      --danger: #ff453a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }

    html, body {
      background: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: auto;
      scroll-behavior: smooth;
    }

    ::selection {
      background: rgba(10,132,255,0.3);
      color: #f5f5f7;
    }

    /* ── Canvas background ───────────────────────────────────── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Vignette overlay ────────────────────────────────────── */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
    }

    #grain {
      display: none;
    }

    #root { position: relative; z-index: 2; }

    /* ── 3D tilt on cards ────────────────────────────────────── */
    .tilt-card {
      transition: transform 0.2s cubic-bezier(0.25,0.1,0.25,1),
                  box-shadow 0.2s cubic-bezier(0.25,0.1,0.25,1);
      will-change: transform;
    }
    .tilt-card:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.4) !important;
    }

    /* ── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    input:focus, textarea:focus {
      border-color: rgba(10,132,255,0.5) !important;
      box-shadow: 0 0 0 3px rgba(10,132,255,0.1) !important;
      outline: none;
    }

    input, textarea, select { cursor: text; }

    /* ── Buttons ─────────────────────────────────────────────── */
    button:not(:disabled) {
      transition: all 0.2s cubic-bezier(0.25,0.1,0.25,1);
    }
    button:hover:not(:disabled) {
      opacity: 0.85;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
      transition-duration: 0.1s;
    }

    /* ── Animations ──────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-100%); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-6px); }
      30%     { transform: translateX(6px); }
      45%     { transform: translateX(-4px); }
      60%     { transform: translateX(4px); }
      75%     { transform: translateX(-2px); }
      90%     { transform: translateX(2px); }
    }
    @keyframes messageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotBounce {
      0%,80%,100% { transform: translateY(0);   }
      40%         { transform: translateY(-6px); }
    }

    .card-enter { animation: fadeUp 0.4s cubic-bezier(0.25,0.1,0.25,1) both; }
    .stagger-enter { animation: fadeUp 0.4s cubic-bezier(0.25,0.1,0.25,1) both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="vignette"></div>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
  // ═══════════════════════════════════════════════════════════
  //  1. 3D TILT — very subtle, 3 degrees max
  // ═══════════════════════════════════════════════════════════
  (function() {
    const MAX_TILT = 3;

    function applyTilt(card) {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const cx   = rect.left + rect.width / 2;
        const cy   = rect.top  + rect.height / 2;
        const dx   = (e.clientX - cx) / (rect.width  / 2);
        const dy   = (e.clientY - cy) / (rect.height / 2);
        const rotX =  dy * -MAX_TILT;
        const rotY =  dx *  MAX_TILT;
        card.style.transform =
          `perspective(1200px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
        card.style.transition = 'transform 0.3s cubic-bezier(0.25,0.1,0.25,1)';
        setTimeout(() => { card.style.transition = ''; }, 300);
      });
    }

    const observer = new MutationObserver(() => {
      document.querySelectorAll('.tilt-card:not([data-tilted])').forEach(card => {
        card.setAttribute('data-tilted', '1');
        applyTilt(card);
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  })();

  // ═══════════════════════════════════════════════════════════
  //  2. AMBIENT AURORA CANVAS — subtle mesh gradient background
  // ═══════════════════════════════════════════════════════════
  (function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    // Check for reduced motion preference
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.screen.width < 768;

    const ORB_COLORS = [
      { r: 10, g: 132, b: 255, a: 0.08 },   // Apple blue
      { r: 94, g: 92, b: 230, a: 0.07 },    // Indigo
      { r: 175, g: 82, b: 222, a: 0.06 },   // Purple
      { r: 48, g: 209, b: 88, a: 0.04 },    // Green (subtle)
    ];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    // Orbs
    function makeOrb(i) {
      const c = ORB_COLORS[i % ORB_COLORS.length];
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        baseR: 250 + Math.random() * 250,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        color: c,
        phase: Math.random() * Math.PI * 2,
        breatheSpeed: 0.0003 + Math.random() * 0.0002,
      };
    }

    // Particles (distant stars)
    function makeParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.5 + Math.random() * 1,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        alpha: 0.1 + Math.random() * 0.2,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.008 + Math.random() * 0.012,
      };
    }

    const orbCount = isMobile ? 2 : 4;
    const particleCount = isMobile ? 10 : 25;
    let orbs = [];
    let particles = [];
    let time = 0;
    let animate = !prefersReducedMotion;

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Draw orbs
      orbs.forEach(o => {
        const breathe = Math.sin(time * o.breatheSpeed + o.phase) * 0.1 + 1;
        const r = o.baseR * breathe;

        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
        g.addColorStop(0, `rgba(${o.color.r},${o.color.g},${o.color.b},${o.color.a * 1.5})`);
        g.addColorStop(0.5, `rgba(${o.color.r},${o.color.g},${o.color.b},${o.color.a})`);
        g.addColorStop(1, `rgba(${o.color.r},${o.color.g},${o.color.b},0)`);

        ctx.beginPath();
        ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        // Move
        o.x += o.vx;
        o.y += o.vy;
        if (o.x < -r) o.x = W + r;
        if (o.x > W + r) o.x = -r;
        if (o.y < -r) o.y = H + r;
        if (o.y > H + r) o.y = -r;
      });

      // Draw particles
      particles.forEach(p => {
        p.twinkle += p.twinkleSpeed;
        const a = p.alpha * (0.4 + 0.6 * Math.sin(p.twinkle));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
      });

      time++;
      if (animate) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    orbs = Array.from({ length: orbCount }, (_, i) => makeOrb(i));
    particles = Array.from({ length: particleCount }, makeParticle);
    draw();
  })();
  </script>
</body>
</html>
